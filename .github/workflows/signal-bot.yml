name: AxTrader Signal Bot

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes, 24/7
  workflow_dispatch:           # Manual trigger from GitHub Actions tab

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Signal Bot
        run: python scripts/signal_bot.py
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
