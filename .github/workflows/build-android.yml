name: Build Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code (integer, increment for each release)'
        required: false
        default: '1'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias axtrader \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keystore ${{ github.workspace }}/axtrader-release.keystore \
            -storepass ${{ secrets.KEYSTORE_PASSWORD || 'axtrader2025' }} \
            -keypass ${{ secrets.KEYSTORE_PASSWORD || 'axtrader2025' }} \
            -dname "CN=AxTrader, OU=Mobile, O=Asterix.COM Ltd, L=Accra, ST=Greater Accra, C=GH"

      - name: Make gradlew executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PVERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}" \
            -PVERSION_CODE="${{ github.event.inputs.version_code || '1' }}"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}" \
            -PVERSION_CODE="${{ github.event.inputs.version_code || '1' }}" \
            -PKEYSTORE_FILE="${{ github.workspace }}/axtrader-release.keystore" \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'axtrader2025' }}" \
            -PKEY_ALIAS="axtrader" \
            -PKEY_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'axtrader2025' }}"

      - name: Build Release AAB
        run: |
          ./gradlew bundleRelease \
            -PVERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}" \
            -PVERSION_CODE="${{ github.event.inputs.version_code || '1' }}" \
            -PKEYSTORE_FILE="${{ github.workspace }}/axtrader-release.keystore" \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'axtrader2025' }}" \
            -PKEY_ALIAS="axtrader" \
            -PKEY_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'axtrader2025' }}"

      - name: Print signing fingerprint
        run: |
          echo "=== SHA-256 Fingerprint (for assetlinks.json) ==="
          keytool -list -v \
            -keystore ${{ github.workspace }}/axtrader-release.keystore \
            -alias axtrader \
            -storepass ${{ secrets.KEYSTORE_PASSWORD || 'axtrader2025' }} \
            | grep SHA256
          echo ""
          echo "Copy this fingerprint into .well-known/assetlinks.json"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AxTrader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AxTrader-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AxTrader-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Keystore (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: ${{ github.workspace }}/axtrader-release.keystore
